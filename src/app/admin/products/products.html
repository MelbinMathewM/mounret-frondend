<div class="bg-white p-6 rounded shadow">

    <div class="flex justify-between mb-4">
        <h2 class="text-lg font-semibold">Products</h2>

        <button (click)="openAdd()" class="bg-black text-white px-4 py-2 rounded text-sm">
            Add Product
        </button>
    </div>


    <!-- FORM -->

    <div *ngIf="showForm" class="border p-6 rounded mb-6">

        <h3 class="font-semibold mb-4">
            {{editing ? 'Edit Product' : 'Add Product'}}
        </h3>

        <div class="grid grid-cols-2 gap-4">

            <!-- NAME -->
            <input type="text" placeholder="Product Name" [(ngModel)]="form.name"
                class="border p-2 rounded col-span-2" />

            <!-- IMAGE -->
            <input type="file" (change)="onFileSelected($event)" class="border p-2 rounded col-span-2" />

            <img *ngIf="preview" [src]="preview" class="h-24 border rounded col-span-2">

            <!-- BRAND -->
            <select [(ngModel)]="form.brandId" class="border p-2 rounded">
                <option value="">Select Brand</option>
                <option *ngFor="let b of brands" [value]="b.id">
                    {{b.name}}
                </option>
            </select>

            <!-- CATEGORY -->
            <select [(ngModel)]="form.categoryId" class="border p-2 rounded">
                <option value="">Select Category</option>
                <option *ngFor="let c of categories" [value]="c.id">
                    {{c.name}}
                </option>
            </select>

            <!-- STOCK -->
            <input type="number" placeholder="Stock" [(ngModel)]="form.stock" class="border p-2 rounded" />

            <!-- PRICE -->
            <input type="number" placeholder="Price" [(ngModel)]="form.price" class="border p-2 rounded" />

            <!-- DIMENSIONS -->
            <input type="text" placeholder="Dimensions (ex: 120x80x60 cm)" [(ngModel)]="form.dimensions"
                class="border p-2 rounded" />

            <!-- MATERIAL -->
            <input type="text" placeholder="Material & Finishes" [(ngModel)]="form.material"
                class="border p-2 rounded col-span-2" />

            <!-- DESCRIPTION -->
            <textarea placeholder="Description" [(ngModel)]="form.description" class="border p-2 rounded col-span-2">
      </textarea>

            <!-- ADDITIONAL INFO -->
            <textarea placeholder="Additional Information" [(ngModel)]="form.additionalInfo"
                class="border p-2 rounded col-span-2">
      </textarea>

        </div>

        <div class="flex gap-3 mt-4">
            <button (click)="save()" class="bg-green-600 text-white px-4 py-2 rounded">
                Save
            </button>

            <button (click)="cancel()" class="bg-gray-400 text-white px-4 py-2 rounded">
                Cancel
            </button>
        </div>

    </div>


    <!-- TABLE -->

    <table class="w-full text-left">

        <thead>
            <tr class="border-b">
                <th>Image</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr *ngFor="let p of products" class="border-b">

                <td>
                    <img [src]="'http://localhost:5234'+p.image" class="h-12">
                </td>

                <td>{{p.name}}</td>
                <td>{{p.brandName}}</td>
                <td>{{p.categoryName}}</td>
                <td>{{p.stock}}</td>
                <td>{{p.price}}</td>

                <td class="space-x-2">

                    <button (click)="edit(p)" class="text-blue-600">
                        Edit
                    </button>

                    <button (click)="delete(p.id)" class="text-red-600">
                        Delete
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
