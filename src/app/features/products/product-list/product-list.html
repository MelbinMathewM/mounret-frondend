<div class="max-w-7xl mx-auto px-4">

  <!-- 🔍 Filters -->
  <div class="flex flex-wrap gap-4 my-20">

    <!-- Category -->
    <div class="relative">
      <select [(ngModel)]="filters.categoryId" (change)="applyFilters()"
        class="appearance-none border border-gray-300 rounded-lg px-4 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black">
        <option value="">All Categories</option>
        <option *ngFor="let c of categories" [value]="c.id">
          {{ c.name }}
        </option>
      </select>

      <!-- Arrow -->
      <span class="absolute right-3 top-2.5 text-gray-500 pointer-events-none">
        ▼
      </span>
    </div>

    <!-- Brand -->
    <div class="relative">
      <select [(ngModel)]="filters.brandId" (change)="applyFilters()"
        class="appearance-none border border-gray-300 rounded-lg px-4 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black">
        <option value="">All Brands</option>
        <option *ngFor="let b of brands" [value]="b.id">
          {{ b.name }}
        </option>
      </select>

      <span class="absolute right-3 top-2.5 text-gray-500 pointer-events-none">
        ▼
      </span>
    </div>

    <!-- Sort -->
    <div class="relative">
      <select [(ngModel)]="filters.sortBy" (change)="applyFilters()"
        class="appearance-none border border-gray-300 rounded-lg px-4 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black">
        <option value="">Sort</option>
        <option value="price_asc">Price Low → High</option>
        <option value="price_desc">Price High → Low</option>
      </select>

      <span class="absolute right-3 top-2.5 text-gray-500 pointer-events-none">
        ▼
      </span>
    </div>

  </div>

  <!-- ⏳ Loading -->
  <div *ngIf="loading" class="text-center py-20 text-gray-500">
    Loading products...
  </div>

  <!-- ❌ No Data -->
  <div *ngIf="!loading && products?.length === 0" class="text-center py-20 text-gray-400">
    No products found
  </div>

  <!-- 🛍 Products Grid -->
  <div *ngIf="products && !loading" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    <div *ngFor="let p of products" class="group cursor-pointer" [routerLink]="['/products', p.id]">

      <!-- Image -->
      <div class="border rounded-xl overflow-hidden bg-white p-4 transition-all duration-300 group-hover:shadow-lg">

        <img [src]="'http://localhost:5234' + p.image"
          class="w-full h-56 object-cover transition-transform duration-300 group-hover:scale-105" />

      </div>

      <!-- Info -->
      <div class="text-center mt-4">

        <p class="text-xs tracking-widest uppercase font-medium">
          {{ p.name }}
        </p>

        <p class="text-xs text-gray-500 mt-1">
          {{ p.brandName }}
        </p>

      </div>

      <!-- Button -->
      <button (click)="$event.stopPropagation()"
        class="w-full bg-black text-white py-2.5 mt-3 text-xs tracking-widest rounded-lg hover:bg-gray-800">
        GET PRICE
      </button>

    </div>

  </div>

</div>
