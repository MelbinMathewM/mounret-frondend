<!-- 💬 Floating Button -->
<button
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 bg-black text-white px-4 py-3 rounded-full shadow-lg z-50">
  💬
</button>

<!-- 🧠 Chat Box -->
<div *ngIf="isOpen"
     class="fixed bottom-20 right-6 w-80 bg-white shadow-2xl rounded-xl flex flex-col z-50">

  <!-- Header -->
  <div class="p-4 border-b font-medium">
    Mounret Assistant
  </div>

  <!-- Messages -->
  <div class="flex-1 p-4 overflow-y-auto h-80 space-y-3">

    <div *ngFor="let msg of messages">

      <div *ngIf="msg.role === 'user'"
           class="text-right">
        <span class="bg-black text-white px-3 py-2 rounded-lg inline-block text-sm">
          {{msg.text}}
        </span>
      </div>

      <div *ngIf="msg.role === 'ai'"
           class="text-left">
        <span class="bg-gray-200 px-3 py-2 rounded-lg inline-block text-sm">
          {{msg.text}}
        </span>
      </div>

    </div>

    <!-- ⏳ Loading -->
    <div *ngIf="loading" class="text-sm text-gray-400">
      Typing...
    </div>

  </div>

  <!-- Input -->
  <div class="p-3 border-t flex gap-2">

    <input
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Ask about products..."
      class="flex-1 border rounded px-3 py-2 text-sm outline-none"
    />

    <button
      (click)="sendMessage()"
      class="bg-black text-white px-3 rounded">
      →
    </button>

  </div>

</div>
